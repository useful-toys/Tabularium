name: Bug
description: Comportamento que parece diferente do que a spec diz. A triagem confirma se é bug ou se é uma necessidade de mudar a spec.
labels: [bug]
body:
  - type: textarea
    id: observado
    attributes:
      label: Comportamento observado
      description: O que acontece e por que parece errado.
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Comportamento esperado
      description: O que você esperava, e o item da spec que diz isso, se souber.
  - type: textarea
    id: reproduzir
    attributes:
      label: Como reproduzir
      description: Passos, dados e ambiente.
