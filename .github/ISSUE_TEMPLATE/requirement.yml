name: Requirement
description: Necessidade ou ideia de requisito novo, alterado, removido ou substituído, para amadurecer antes de virar PR.
labels: [requirement]
body:
  - type: textarea
    id: problema
    attributes:
      label: Problema ou necessidade
      description: O que o usuário não consegue fazer hoje, ou faz mal. Se já tiver uma ideia de solução, escreva também. Não precisa estar completo; use /spec-grill para amadurecer.
    validations:
      required: true
