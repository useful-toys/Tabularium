name: spec-check

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  spec-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Testes do script
        run: node --test scripts/spec.test.mjs

      - name: Check da spec
        env:
          BASE_REF: origin/${{ github.base_ref }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: node scripts/spec.mjs check --base "$BASE_REF" --labels "$LABELS"
